allowBuilds:
  esbuild: true
  sharp: false
# Name patterns, not name@version: the supply-chain verify gate matches by
# package-name glob, so versioned entries are silently ignored.
minimumReleaseAgeExclude:
  - astro
  - "@astrojs/*"
# minimatch ReDoS (GHSA-g3hv-75wg-m249): eslint, @eslint/config-array and
# @typescript-eslint/typescript-estree pin ^10.2.x. Drop once they allow >=11.0.1.
overrides:
  minimatch: ^11.0.1
